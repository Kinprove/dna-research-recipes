name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  beider-lookup:
    name: Beider lookup regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline lookup tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s skills/genealogy-research-recipes/tests -p 'test_*.py'

  hermes:
    name: Hermes native plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          # Freeze the runtime that exercises the public register_skill contract.
          ref: 6cf3104d749b49151a22a5cdbe40dc729577b505
          path: .hermes-runtime
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.10"
      - name: Prepare the pinned Hermes runtime
        run: |
          HERMES_RUNTIME="$RUNNER_TEMP/hermes-runtime"
          printf 'HERMES_RUNTIME=%s\n' "$HERMES_RUNTIME" >> "$GITHUB_ENV"
          mv .hermes-runtime "$HERMES_RUNTIME"
          uv sync --project "$HERMES_RUNTIME" --frozen --no-dev --python 3.14
      - name: Run native plugin unit tests
        run: uv run --project "$HERMES_RUNTIME" --frozen --no-dev python -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate native plugin and real registration
        run: |
          uv run --project "$HERMES_RUNTIME" --frozen --no-dev hermes plugins validate . --json
          uv run --project "$HERMES_RUNTIME" --frozen --no-dev hermes plugins doctor . --ci
      - name: Exercise namespaced skill and recipe access in an isolated profile
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ runner.temp }}/hermes-runtime
          TMPDIR: ${{ runner.temp }}
        run: uv run --project "$HERMES_RUNTIME" --frozen --no-dev python -B tests/check_hermes_runtime.py

  openclaw:
    name: OpenClaw native plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Freeze the runtime that installs and loads the native plugin.
      - name: Install the pinned OpenClaw CLI
        run: npm install -g openclaw@2026.9.8
      - name: Run native plugin unit tests
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install and inspect the native plugin in an isolated profile
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TMPDIR: ${{ runner.temp }}
        run: python3 -B tests/check_openclaw_runtime.py

  validate:
    name: Plugin validate (--strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.210
      - name: Validate marketplace + plugin manifest
        run: claude plugin validate . --strict

  markdownlint:
    name: markdownlint (check-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Check-only: markdownlint-cli2 does NOT modify files (no --fix). Config is the
      # committed .markdownlint-cli2.jsonc. Fix the source/generator and regenerate on a
      # finding; never format generated bytes in CI.
      - name: markdownlint-cli2
        run: npx --yes markdownlint-cli2@0.23.0 "**/*.md"

  gitleaks:
    name: Secret scan (gitleaks, fail-closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # -----------------------------------------------------------------------------
      # TODO (export round — cross-repo dependency, owned by the pipeline maintainer):
      #   The canonical `.gitleaks.toml` is owned by the private source repository (its
      #   pre-write export hook uses the identical file). It is copied byte-for-byte into
      #   this repo root during the export round, and this job then asserts SHA-256
      #   equality of both copies. Do NOT author a divergent `.gitleaks.toml` here.
      #   Replace the image digest below with the SAME immutable @sha256 pin used in the
      #   export pre-write hook (human version tag kept in the adjacent comment). The `dir`
      #   subcommand scans filesystem bytes (inherently no-git — there is NO `--no-git`
      #   flag on it). Fail-closed on findings AND on any non-1 nonzero scanner exit.
      # -----------------------------------------------------------------------------
      - name: gitleaks (pinned image)
        run: |
          set -euo pipefail
          if [ ! -f .gitleaks.toml ]; then
            echo "::error::.gitleaks.toml is missing — it must be copied from the canonical source during the export round."
            exit 1
          fi
          # gitleaks v8.30.1 (human tag) — immutable digest pinned below.
          docker run --rm -v "${PWD}:/scan" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir --config /scan/.gitleaks.toml --exit-code 1 /scan
